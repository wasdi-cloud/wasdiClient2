<div class="ai-container">
  <div class="messages-container" #messagesContainer>
        <section class="message-feed">
    
            @for (msg of messages(); track msg.id) {
            <div [class]="'message-bubble ' + msg.role">
              <markdown [data]="msg.content"></markdown>

                @if (msg.attachments?.length) {
                <div class="attachment-grid">
                    @for (url of msg.attachments; track url) {
                    <img [src]="url" class="eo-preview-thumb" alt="AI Generated Preview" />
                    }
                </div>
                }
            </div>
            } @empty {
            <div class="hero-welcome">
              <div class="hero-icon">
                <span class="material-symbols-outlined">smart_toy</span>
              </div>
              <div class="hero-title">How can I assist today?</div>
              <div class="hero-sub">Ask me anything about your EO data, processing workflows, or WASDI features.</div>
            </div>
            }
        </section>
    </div>

  @if (isLoading()) {
  <div class="loading-container">
    <app-invader></app-invader>
  </div>
  }

  <!-- Floating Input Dock -->
  <div class="input-dock-wrapper">
    <div class="input-dock">
      <textarea #promptInput 
        class="chat-textarea"
        placeholder="Ask about your EO data..."
        [disabled]="isDisabled()"
        >
      </textarea>
      <div class="dock-toolbar">
        <select class="model-select"
          [(ngModel)]="selectedModel"
          [disabled]="isDisabled()">
          @for (model of modelOptions; track model) {
            <option [value]="model">{{model}}</option>
          }
        </select>
        <button class="btn-send" (click)="submit(promptInput.value)" [disabled]="isDisabled()">
          <span class="material-symbols-outlined">send</span>
          Send
        </button>
      </div>
    </div>
  </div>
</div>
