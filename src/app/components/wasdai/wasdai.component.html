<main class="chat-shell">
  <!-- Left Chat History Sidebar -->
  <div class="chat-sidebar">
    <div class="sidebar-header">
      <button class="btn-new-chat" (click)="onNewChat()">
        <span class="material-symbols-outlined">add</span> New Chat
      </button>
    </div>
    <div class="chat-list">
      @if (isLoadingChats()) {
        <div class="loading">Loading chats...</div>
      } @else if (chats().length === 0) {
        <div class="empty-message">No chats yet</div>
      } @else {
        @for (chat of chats(); track chat.chatId) {
          <div class="chat-item" 
            [class.active]="m_sActiveTab === chat.chatId" 
            (click)="onSelectChat(chat.chatId)">
            <div class="chat-item-title">{{chat.title}}</div>
            <div class="chat-item-date">{{chat.timestamp | date:'short'}}</div>
          </div>
        }
      }
    </div>
  </div>

  <!-- Right Chat Workspace -->
  <div class="chat-main">
    <div class="chat-header">
      <div class="chat-title-group">
        <span class="material-symbols-outlined" style="color: var(--wasdiGreen);">smart_toy</span>
        <span class="assistant-name">WASDI Assistant</span>
        <span class="badge-beta">BETA</span>
      </div>
    </div>

    <div class="dashboard-content-wrapper">
      <app-assistant-chat
        [chatId]="currentChatId()"
        [initialMessages]="currentChatMessages()"
        [modelOptions]="assistantModels"
        [selectedModel]="defaultAssistantModel"
      ></app-assistant-chat>
    </div>
  </div>
</main>
